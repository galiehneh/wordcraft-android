<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <link rel="icon" href="./wordcraft-fa59e09a3f921e03.ico" integrity="sha384-99DzWb82rFgkdw7hjKziyDQaHbMTklb9MWeLKF7LcVUnq80H4nDrc/pjHJtAj/AA"/>
  
<script type="module">
import init, * as bindings from './wordcraft-web-c8337fb9c65c17e1.js';
const wasm = await init({ module_or_path: './wordcraft-web-c8337fb9c65c17e1_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
  <script>
    (function() {
      // The text input eframe adds right after the canvas to receive typing and the soft keyboard.
      function textAgentInput() {
        var canvas = document.getElementById('wordcraft_canvas');
        var el = canvas && canvas.nextElementSibling;
        return el && el.tagName === 'INPUT' ? el : null;
      }

      // Called from the Rust UI (js_sys::eval) when it enters or leaves edit mode.
      // Inside the Android app they do nothing: eframe focuses its input while egui wants an IME
      // and the host is told from Rust, so a shim must not raise the keyboard on its own.
      window.showSoftKeyboard = function() {
        if (window.WordCraftHost) return;
        var input = textAgentInput();
        if (!input) return;
        try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
      };
      window.hideSoftKeyboard = function() {
        if (window.WordCraftHost) return;
        var input = textAgentInput();
        if (input) { try { input.blur(); } catch (e) {} }
      };
      window.setWordCraftEditMode = function(on) {
        if (!on) window.hideSoftKeyboard();
      };
      window.setDocumentOpened = function() {};

      document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);

      // Android host (docs/host-protocol.md). Absent in a normal browser: nothing below runs.
      var host = window.WordCraftHost;
      if (!host) return;

      // JS -> native. The Rust side sends everything through these two functions.
      var CHUNK_BYTES = 512 * 1024;
      var arrayBufferOk = true;
      var chunkSeq = 0;
      var lastState = { name: 'document.docx', rev: 0 };
      function post(obj) { window.wordcraftHostPost(JSON.stringify(obj)); }
      window.wordcraftHostPost = function(json) {
        try {
          var obj = JSON.parse(json);
          if (obj && obj.type === 'state') lastState = obj;
        } catch (e) {}
        host.postMessage(json);
      };
      function base64(bytes) {
        var bin = '';
        for (var i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(bin);
      }
      // One ArrayBuffer [u32 LE header length][header JSON][bytes]; where the WebView takes no
      // ArrayBuffer (postMessage throws), the same message as base64 chunks.
      function postFrame(header, bytes) {
        if (arrayBufferOk) {
          var h = new TextEncoder().encode(JSON.stringify(header));
          var out = new Uint8Array(4 + h.length + bytes.length);
          new DataView(out.buffer).setUint32(0, h.length, true);
          out.set(h, 4);
          out.set(bytes, 4 + h.length);
          try { host.postMessage(out.buffer); return; }
          catch (e) {
            // Only "this WebView takes no ArrayBuffer" turns chunking on for good; any other
            // failure is this message's, and the next one tries the ArrayBuffer again.
            if (!(e instanceof TypeError || (e && e.name === 'DataCloneError'))) throw e;
            arrayBufferOk = false;
            console.warn('host takes no ArrayBuffer; sending base64 chunks', e);
          }
        }
        var id = ++chunkSeq;
        var chunks = Math.max(1, Math.ceil(bytes.length / CHUNK_BYTES));
        for (var i = 0; i < chunks; i++) {
          host.postMessage(JSON.stringify({
            type: 'chunk', id: id, index: i, chunks: chunks, header: header,
            data: base64(bytes.subarray(i * CHUNK_BYTES, (i + 1) * CHUNK_BYTES))
          }));
        }
      }
      window.wordcraftHostPostFrame = function(headerJson, bytes) { postFrame(JSON.parse(headerJson), bytes); };

      // ready: once Trunk has started the wasm module.
      var readySent = false;
      function sendReady() { if (!readySent) { readySent = true; post({ type: 'ready' }); } }
      window.addEventListener('TrunkApplicationStarted', sendReady);
      if (window.wasmBindings) sendReady();

      // The soft keyboard is posted from Rust (HostSync): `ime` follows egui's PlatformOutput.ime,
      // the single source of truth. No focusin/focusout heuristic here.

      // Links that open a window go to the system browser instead.
      window.open = function(url) {
        try { post({ type: 'openExternal', url: new URL(String(url || ''), location.href).href }); }
        catch (e) { console.warn('window.open ignored:', url, e); }
        return null;
      };

      // native -> JS: events arrive as JSON text. They wait until the wasm exports exist and the
      // app is running (wordcraftHostUp, called from Rust), then run in order.
      var queue = [];
      var MAX_QUEUE = 256;
      var appUp = false;
      function handle(msg) {
        var api = window.wasmBindings;
        try {
          switch (msg.type) {
            case 'open':
              api.wordcraft_open_url(String(msg.url || ''), String(msg.name || ''), msg.recovered === true);
              break;
            case 'saveResult':
              api.wordcraft_save_result(msg.ticket >>> 0, String(msg.outcome || 'failed'), String(msg.message || ''), typeof msg.name === 'string' ? msg.name : undefined);
              break;
            case 'back':
              post({ type: 'backResult', handled: !!api.wordcraft_back() });
              break;
            case 'snapshotNow': {
              var bytes = api.wordcraft_snapshot_now();
              if (bytes) postFrame({ type: 'snapshot', name: lastState.name, rev: lastState.rev }, bytes);
              break;
            }
            default:
              console.warn('unknown host event:', msg.type);
          }
        } catch (e) {
          console.error('host event failed:', msg.type, e);
          if (msg.type === 'back') post({ type: 'backResult', handled: false });
        }
      }
      function drain() {
        while (appUp && window.wasmBindings && queue.length) handle(queue.shift());
      }
      window.wordcraftHostUp = function() { appUp = true; drain(); };
      window.wordcraftHostEvent = function(raw) {
        var msg;
        try { msg = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { console.warn('bad host event:', e); return; }
        if (!msg || typeof msg !== 'object') { console.warn('bad host event:', raw); return; }
        if (queue.length >= MAX_QUEUE) {
          var dropped = queue.shift();
          console.warn('host event queue full (' + MAX_QUEUE + '); dropped the oldest:', dropped && dropped.type);
        }
        queue.push(msg);
        drain();
      };
      host.onmessage = function(ev) { window.wordcraftHostEvent(ev.data); };
    })();
  </script>

<body>

</body>
</html>
