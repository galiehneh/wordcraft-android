<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>WordCraft</title>
  <link rel="icon" href="./wordcraft-fa59e09a3f921e03.ico" integrity="sha384-99DzWb82rFgkdw7hjKziyDQaHbMTklb9MWeLKF7LcVUnq80H4nDrc/pjHJtAj/AA"/>
  
<script type="module">
import init, * as bindings from './wordcraft-web-5394b162e46f96e2.js';
const wasm = await init({ module_or_path: './wordcraft-web-5394b162e46f96e2_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e6e6e6; }
    #wordcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
  <script>
    (function() {
      // Helper to find the hidden input element created by eframe TextAgent
      function getTextAgentInput() {
        return document.querySelector('input[type="text"]') || document.querySelector('input');
      }

      function notifyShowKeyboard() {
        if (window.WordCraftAndroid && window.WordCraftAndroid.showKeyboard) {
          window.WordCraftAndroid.showKeyboard();
        }
      }

      function notifyHideKeyboard() {
        if (window.WordCraftAndroid && window.WordCraftAndroid.hideKeyboard) {
          window.WordCraftAndroid.hideKeyboard();
        }
      }

      window.showSoftKeyboard = function() {
        const input = getTextAgentInput();
        if (input) {
          try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
        }
        notifyShowKeyboard();
      };

      window.hideSoftKeyboard = function() {
        const input = getTextAgentInput();
        if (input) {
          try { input.blur(); } catch (e) {}
        }
        notifyHideKeyboard();
      };

      window.setWordCraftEditMode = function(on) {
        window.isWordCraftEditMode = on;
        if (!on) {
          window.hideSoftKeyboard();
        }
      };

      window.setDocumentOpened = function(opened) {
        if (window.WordCraftAndroid && window.WordCraftAndroid.setDocumentOpened) {
          window.WordCraftAndroid.setDocumentOpened(opened);
        }
      };

      function hookAgentInput(input) {
        if (!input || input.__agentHooked) return;
        input.__agentHooked = true;
        input.addEventListener('focus', function() {
          notifyShowKeyboard();
        });
        input.addEventListener('blur', function() {
          notifyHideKeyboard();
        });
      }

      const agentObserver = new MutationObserver(function() {
        const input = getTextAgentInput();
        if (input) hookAgentInput(input);
      });
      agentObserver.observe(document.documentElement, { childList: true, subtree: true });

      // When canvas is tapped on mobile:
      document.addEventListener('DOMContentLoaded', function() {
        const canvas = document.getElementById('wordcraft_canvas');
        if (canvas) {
          canvas.setAttribute('tabindex', '0');
          canvas.addEventListener('touchend', function(e) {
            if (window.isWordCraftEditMode) {
              const input = getTextAgentInput();
              if (input) {
                try { input.focus({ preventScroll: true }); } catch (err) { input.focus(); }
              }
              notifyShowKeyboard();
            }
          }, { passive: true });
        }
      });

      const origClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        if (this.href && this.href.startsWith("blob:") && window.WordCraftAndroid) {
          const href = this.href;
          const filename = this.download || "document.docx";
          fetch(href)
            .then(function(res) { return res.blob(); })
            .then(function(blob) {
              const reader = new FileReader();
              reader.onloadend = function() {
                if (window.WordCraftAndroid && window.WordCraftAndroid.saveBlob) {
                  window.WordCraftAndroid.saveBlob(reader.result, filename);
                }
              };
              reader.readAsDataURL(blob);
            })
            .catch(function(err) {
              console.error("Blob download interception error:", err);
            });
        }
        return origClick.apply(this, arguments);
      };

      window.handleAndroidBack = function() {
        const ev = new KeyboardEvent('keydown', {
          key: 'Escape',
          code: 'Escape',
          keyCode: 27,
          which: 27,
          bubbles: true
        });
        window.dispatchEvent(ev);
        document.dispatchEvent(ev);
      };

      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      }, false);
    })();
  </script>

</body>
</html>
